[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "batteryswap"
version = "0.1.0"
description = "BatterySwapAI 2026 — probabilistic RUL + cost-optimal maintenance scheduling"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyarrow>=16,<20",
    "PyYAML>=6.0,<7",
    "scipy>=1.13,<2",
    "scikit-learn>=1.5,<2",
    "lightgbm>=4.3,<5",
    "lifelines>=0.28,<1",
    "ortools>=9.10,<10",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.16,<0.17",
]

[project.scripts]
batteryswap = "batteryswap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Selected explicitly. Every CI run before this pin failed on the lint step,
# never on a test: `ruff>=0.5` floats to the newest release, and ruff has since
# moved rules into its default set that were not in it when that floor was
# written. With `select` spelled out and the version bounded, a ruff release
# can no longer turn this repository red on its own.
select = ["E", "F", "I", "B", "SIM", "UP", "RUF", "ISC", "FURB", "TRY"]
ignore = [
    # Descriptive messages at the `raise` site are deliberate: most of them
    # name the offending value, which is what makes a failed run diagnosable.
    "TRY003",
    # `zip(strict=)` changes behaviour (raises on ragged input) rather than
    # style. Worth adopting, but not in the same commit as a lint cleanup.
    "B905",
]

[tool.ruff.lint.per-file-ignores]
# bundle.py embeds, inside the submission README it writes, the exact `docker
# run` line that reproduces the official score. It is one 214-column string
# meant to be copy-pasted; wrapping it would defeat the only reason it is there.
"src/batteryswap/bundle.py" = ["E501"]
