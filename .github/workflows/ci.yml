name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: python -m pytest -q
      # full synthetic rehearsal — proves the pipeline wires together
      - run: python -m batteryswap.cli dry-run --buildings 5 --alns-iterations 500
